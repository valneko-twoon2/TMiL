\* Backend.tla の検査設定（PID 2 つ、うち 1 つは TaskManagerLite 自身。PID は 2 回まで使い回す）
CONSTANTS
    Pids = {1, 2}
    Protected = {1}
    MaxIncarnation = 3
    MStep <- Step

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Safe
    ElevationConsistent
    CacheBeliefCorrect

PROPERTIES
    SamplingCompletes
    ElevationCompletes
