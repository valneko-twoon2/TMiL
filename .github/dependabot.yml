# 依存関係の更新。PR が増えすぎないよう、週 1 回・minor と patch はまとめる。
# 宛先は develop（セキュリティ更新は既定ブランチ = develop に来る）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Tauri 3 は安定版が出るまで上げない
      - dependency-name: tauri*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
