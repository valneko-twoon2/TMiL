name: Linux の依存パッケージ
description: Tauri のビルドに必要なパッケージ（E2E 用のドライバーも任意で）を入れる

inputs:
  e2e:
    description: 実アプリの E2E 用に WebKitWebDriver と Xvfb も入れる
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: apt でインストール
      shell: bash
      env:
        WITH_E2E: ${{ inputs.e2e }}
      run: |
        packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file"
        if [ "$WITH_E2E" = "true" ]; then
          packages="$packages webkit2gtk-driver xvfb"
        fi
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $packages
