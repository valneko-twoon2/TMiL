# CodeQL によるセキュリティ検査。main への PR では必須チェックにしている。
name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  # 途中で止めると、結果の送信が中断して「CodeQL is reporting errors」と出る。止めずに順番を待つ
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - src/frontend/dist
              - src/frontend/dist-mock
              - src/backend/target
              - coverage
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
