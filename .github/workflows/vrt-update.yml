# VRT の基準画像を CI と同じ環境（Linux）で作り直し、成果物として置く。
# 画面を意図して変えたときに手動で実行し、手元で `npm run vrt:pull` して取り込みコミットする。
# （Actions から直接 push すると、そのコミットに CI が走らないため）
name: VRT 基準画像の更新

on:
  workflow_dispatch:

concurrency:
  group: vrt-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: 基準画像を作る
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - run: npx playwright test --project=vrt --update-snapshots=all
        working-directory: src/frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baselines
          path: tests/vrt/**/*-linux.png
          if-no-files-found: error
          retention-days: 7
